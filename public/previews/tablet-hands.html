<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>StoreWell · Hands preview</title>
<link rel="stylesheet" href="/command-tablet.css"><link rel="stylesheet" href="/command-hologram.css"><link rel="stylesheet" href="/tablet-hands.css">
<style>
html,body{margin:0;height:100%;background:#112d3d;color:#e4f6ff;font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 15% 20%,#416678,transparent 65%),linear-gradient(145deg,#314d5a,#071922)}
.preview-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 20px;background:#081d29}.preview-bar strong{font-size:16px}.preview-bar p{margin:5px 0 0;color:#b9d7e4;font-size:12px}.preview-bar nav{display:flex;gap:8px}.preview-bar button,.preview-bar a{border:1px solid #70c3e0;background:#163e52;color:#e9faff;border-radius:7px;padding:11px 15px;font:600 12px 'Segoe UI',sans-serif;text-decoration:none;cursor:pointer}.preview-bar button[aria-pressed=true]{background:#286783;border-color:#a3ecff}.preview-stage{height:calc(100dvh - 76px);display:grid;place-items:center;padding:8px}.preview-stage iframe{width:100%;height:100%;border:1px solid #73c6df6b;border-radius:16px;max-width:1400px}.preview-stage.phone iframe{width:min(390px,100%);max-height:844px}.preview-notice{color:#b5d9e9;font-size:12px;line-height:1.6}.preview-confirmation{border:1px solid #79cfee80;padding:13px;border-radius:7px;min-height:52px;background:#12537232;color:#c9f2ff;margin-top:17px}.preview-palette{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.preview-palette label{color:#bddde9;font-size:12px}.preview-palette select{padding:9px;min-height:44px}.preview-screen #sw-tablet{padding-top:12px;padding-bottom:12px}.preview-screen .tablet-device{animation:none}.preview-screen .tablet-page{min-height:0}.preview-screen .page-heading h1{font-size:25px}.preview-screen .lock-bank{margin-top:12px}.preview-screen .tablet-nav button{cursor:pointer}
@media(max-width:600px){.preview-bar{padding:10px;align-items:flex-start}.preview-bar nav{gap:5px}.preview-bar button,.preview-bar a{padding:10px 8px;font-size:10px}.preview-bar p{max-width:190px;font-size:10px}.preview-bar strong{font-size:13px}.preview-stage{height:calc(100dvh - 84px);padding:4px}.preview-screen .tablet-bottom button{font-size:11px!important}.preview-screen .tablet-page{padding-top:13px}}
</style></head><body>
<script src="/tablet-hands.js"></script>
<script>
(()=>{
  // Public artwork preview only. No staff code, authentication, records or network writes.
  if(!new URLSearchParams(location.search).has('display')){
    document.body.innerHTML='<header class="preview-bar"><div><strong>StoreWell · Hands preview</strong><p>Try the hands. Sample controls only; your locks are unaffected.</p></div><nav aria-label="Preview size"><button data-size="tablet" aria-pressed="true">Tablet</button><button data-size="phone" aria-pressed="false">Phone</button><a href="/">Open app</a></nav></header><main class="preview-stage"><iframe title="Interactive tablet hands preview" src="/previews/tablet-hands.html?display=tablet"></iframe></main>';
    document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelector('.preview-stage').classList.toggle('phone',b.dataset.size==='phone');document.querySelectorAll('[data-size]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));});return;
  }
  document.body.className='preview-screen';
  const lock='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>';
  const states=[['Rented','#64ef9d'],['Late','#ff7994'],['Lock It','#ff526f'],['Lock Off','#43f68a'],['Reserved','#6bbdff'],['Rented · No Lock','#ffdc77'],['Ready to Rent','#c6a3ff'],['Empty','#edf8ff'],['Not rentable','#a8b7c6']];
  document.body.innerHTML='<section id="sw-tablet" aria-label="Sample command tablet"><div class="tablet-device"><div class="tablet-hardware"><i></i><span>STOREWELL</span><b>HANDS PREVIEW</b></div><div class="tablet-glass"><header class="tablet-header"><button class="tablet-brand" data-preview="Overview"><span class="tablet-emblem">'+lock+'</span><span><strong>StoreWell<span>Command</span></strong><small>EVERY DOOR. ONE PLACE.</small></span></button><div class="tablet-session"><span>Visual preview</span><small>No live changes</small></div></header><div class="tablet-strip"><span>CHARACTER HANDS</span><span>SAMPLE CONTROLS</span></div><nav class="tablet-nav" aria-label="Sample tablet screens">'+['Action required','All locks','Route','Lock History','Team','Control'].map(label=>'<button data-preview="'+label+'"'+(label==='All locks'?' class="active"':'')+'>'+label+'</button>').join('')+'</nav><main class="tablet-page"><header class="page-heading"><div><p>YOUR CHARACTER · YOUR TABLET</p><h1>Reach. Touch. Keep moving.</h1><span>Tap any sample button to try the animated hand.</span></div></header><div class="lock-board"><div class="board-caption"><span>ALL NINE LOCK CONTROLS</span><span>VISUAL EXAMPLES</span></div><section class="lock-bank"><header><div><h2>Same controls. A more natural touch.</h2><p>These examples do not read or change any unit.</p></div></header><div class="lock-tile-grid">'+states.map(([label,color],i)=>'<button class="lock-tile" data-preview="'+label+'" style="--status:'+color+'"><span class="lock-tile-icon">'+lock+'</span><span class="lock-tile-copy"><strong>'+String(i+1).padStart(2,'0')+'</strong><span>'+label+'</span></span></button>').join('')+'</div></section></div><div class="preview-confirmation" role="status">Ready — tap a sample control.</div><div class="preview-palette"><label for="preview-character">Character palette</label><select id="preview-character"><option value="soldier">Soldier · Original tan armor</option><option value="xbot">Agent · Red armor</option><option value="robot">Robot · Gold armor</option><option value="cesium">Worker · Light armor</option><option value="police">Police · Navy</option><option value="limo">Limo · Black</option></select></div><p class="preview-notice">The live tablet uses your saved character. This page previews the artwork and tap motion only. Lock History, team information and all live changes stay in the signed-in app.</p></main><footer class="tablet-bottom"><span>ANIMATED CHARACTER HANDS</span><div><button id="preview-hands" aria-pressed="true">Hands on</button><button id="preview-replay">Tap again</button></div></footer></div><div class="tablet-home-bar"></div></div></section>';
  let character={model:'soldier'},count=0;window._swGetChar=()=>character;
  const tablet=document.querySelector('#sw-tablet'),hands=window.StoreWellTabletHands.mount(tablet,{preferenceKey:'sw_tablet_hands_preview'});hands.open();
  document.querySelectorAll('[data-preview]').forEach(button=>button.onclick=()=>{count++;document.querySelector('.preview-confirmation').textContent=button.dataset.preview+' · Sample tap '+count+' received';if(button.closest('.tablet-nav')){document.querySelectorAll('.tablet-nav button').forEach(el=>el.classList.toggle('active',el===button));}});
  document.querySelector('#preview-character').onchange=e=>{character={model:e.target.value};window.dispatchEvent(new Event('sw-character-changed'));};
  document.querySelector('#preview-hands').onclick=e=>{const on=hands.toggle();e.currentTarget.textContent=on?'Hands on':'Hands off';e.currentTarget.setAttribute('aria-pressed',String(on));};
  const toggle=document.querySelector('#preview-hands');toggle.textContent=hands.enabled?'Hands on':'Hands off';toggle.setAttribute('aria-pressed',String(hands.enabled));
  document.querySelector('#preview-replay').onclick=()=>{count++;document.querySelector('.preview-confirmation').textContent='Sample tap '+count+' received';};
})();
</script></body></html>
