<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@keyframes sw-flash-red{0%{background:#ff0000;box-shadow:0 0 0 8px #ff000055,0 0 50px #ff0000,0 0 100px #ff000088;}50%{background:#ff4444;box-shadow:0 0 0 2px #ff000022,0 0 12px #ff000066;}100%{background:#ff0000;box-shadow:0 0 0 8px #ff000055,0 0 50px #ff0000,0 0 100px #ff000088;}}
@keyframes sw-flash-green{0%{background:#00ff44;box-shadow:0 0 0 8px #00ff4455,0 0 50px #00ff44,0 0 100px #00ff4488;}50%{background:#44ff88;box-shadow:0 0 0 2px #00ff4422,0 0 12px #00ff4466;}100%{background:#00ff44;box-shadow:0 0 0 8px #00ff4455,0 0 50px #00ff44,0 0 100px #00ff4488;}}
/* Right-side book tabs — fixed to viewport, always visible */
#sw-tabs{ position:fixed; right:env(safe-area-inset-right,0px); top:max(12px,env(safe-area-inset-top)); display:flex; flex-direction:column; align-items:flex-end; justify-content:flex-start; gap:7px; z-index:200; padding:0; pointer-events:none; }
.sw-tab{ pointer-events:all; flex:0 0 auto; width:136px; min-height:74px; border:none; cursor:pointer; border-radius:14px 0 0 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:10px 12px; color:#fff; -webkit-tap-highlight-color:transparent; transition:transform .08s; box-shadow:-4px 3px 10px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.45); }
.sw-tab:active{ transform:translateX(6px); }
.sw-tab#sw-cmd-tab{ min-height:84px; }
.sw-tab:focus-visible{outline:3px solid #fff;outline-offset:-5px}
.sw-tlbl{ font:800 18px/1.2 'Segoe UI',Arial; letter-spacing:.2px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.65); }
/* Keep sw-glbl for compatibility with setBell() */
.sw-glbl{ font:800 9px 'Segoe UI',Arial; letter-spacing:.3px; text-transform:uppercase; text-shadow:0 1px 2px rgba(0,0,0,.45); }
/* Hide tabs when Command Center is open */
body.sw-cc-open #sw-tabs{ display:none !important; }
/* Short screens use a top dock, leaving the joystick clear at bottom right. */
@media(max-height:700px){
 #sw-tabs{right:max(12px,env(safe-area-inset-right));left:max(12px,env(safe-area-inset-left));width:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));align-items:stretch;gap:6px}
 #sw-tabs .sw-tab{width:100%;min-height:68px;border-radius:12px;padding:8px 5px}
 #sw-tabs .sw-tlbl{font-size:16px}
 .sw-tab:active{transform:translateY(2px)}
}
@media(max-width:600px) and (min-height:701px){.sw-tab{width:116px}.sw-tlbl{font-size:17px}}
/* Outside speed controls share the saved settings with the Command Center. */
body:not(.storewell-deck-open) #sw-sens-panel{top:50%!important;left:50%!important;right:auto!important;transform:translate(-50%,-50%);width:min(390px,calc(100vw - 32px))!important;max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;padding:20px!important;color-scheme:light}
#sw-sens-panel .sw-speed-header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:22px;font-weight:800;margin-bottom:10px}
#sw-sens-panel .sw-speed-header button{min-width:44px;min-height:44px;border:0;border-radius:8px;background:#e7edf2;color:#173a4c;font-size:26px;cursor:pointer}
#sw-sens-panel .sw-speed-help{font:15px/1.45 'Segoe UI',Arial;color:#405a69;margin:0 0 16px}
#sw-sens-panel .sw-speed-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
#sw-sens-panel .sw-speed-row label{font:700 18px/1.25 'Segoe UI',Arial;color:#173a4c}
#sw-sens-panel .sw-speed-row input{width:96px;min-height:48px;padding:8px;border:1px solid #8ba5b4;border-radius:8px;background:#f3f7fa;color:#173a4c;font:800 20px 'Segoe UI',Arial;text-align:center}
#sw-sens-panel #sw-sens-save{min-height:48px;font-size:18px}
#sw-tablet .tablet-tool-host #sw-sens-panel .sw-speed-header,#sw-tablet .tablet-tool-host #sw-sens-panel .sw-speed-help{color:#d5edfc!important}
</style><style>html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,Arial;background:#486372 url('../img/command-storage-lane.webp') center/cover}.preview-note{position:fixed;left:20px;bottom:24px;color:white;text-shadow:0 2px 5px black;font-size:17px;max-width:50%}.sample-joystick{position:fixed;bottom:26px;right:26px;width:132px;height:132px;border:2px solid #ffffff88;border-radius:50%;background:#1f2a3342;display:grid;place-items:center}.sample-joystick:after{content:'';width:58px;height:58px;border-radius:50%;background:#ffffffea}</style></head><body>  <div id="sw-tabs">
    <button  class="sw-tab" style="background: linear-gradient(rgb(87, 176, 247), rgb(31, 111, 214));">

      <span class="sw-tlbl">HOME</span></button>
    <button  class="sw-tab" style="background: linear-gradient(rgb(247, 190, 78), rgb(229, 143, 28));">

      <span style="font-size: 24px; line-height: 1; filter: drop-shadow(rgba(0, 0, 0, 0.35) 0px 1px 1px);">🗺️</span>
      <span class="sw-tlbl">MAP</span></button>
    <button  class="sw-tab" style="background: linear-gradient(rgb(99, 209, 95), rgb(47, 160, 47));">
      <span style="font-size: 24px; line-height: 1; filter: drop-shadow(rgba(0, 0, 0, 0.35) 0px 1px 1px);">🔍</span>
      <span class="sw-tlbl">FIND</span></button>
    <button  id="sw-cmd-tab" aria-label="Enter Command Center" class="sw-tab" style="background: linear-gradient(135deg, rgb(77, 182, 247), rgb(21, 96, 200), rgb(13, 61, 138)); box-shadow: rgba(0, 0, 0, 0.45) -5px 4px 14px, rgba(255, 255, 255, 0.5) 0px 2px 4px inset;">
      <span style="font-size: 26px; line-height: 1; filter: drop-shadow(rgba(0, 0, 0, 0.4) 0px 1px 2px);">⚡</span>

    <button onclick="window.__swGear()" id="sw-speed-tab" aria-label="Speed & Turn" aria-controls="sw-sens-panel" aria-expanded="false" class="sw-tab" style="background:linear-gradient(#157d91,#075061);">
      <span aria-hidden="true" style="font-size:28px;line-height:1;">⚙️</span>
      <span class="sw-tlbl">Speed &amp; Turn</span></button>
    <button  id="sw-exit-tab" class="sw-tab" style="display: none; background: linear-gradient(rgb(224, 82, 82), rgb(181, 32, 32));">
      <span style="font-size: 22px; line-height: 1; filter: drop-shadow(rgba(0, 0, 0, 0.35) 0px 1px 1px);">✕</span>
      <span class="sw-tlbl">EXIT</span></button>
  </div>
<div class="sample-joystick" aria-label="Joystick position sample"></div><div class="preview-note">Outside controls preview<br>Sample backdrop · no live records</div><script>var sampleValues={};var sampleStorage={getItem:function(k){return sampleValues[k]||null},setItem:function(k,v){sampleValues[k]=String(v)}};
/* Bulletproof on-screen controls — built independently of React/SWNet so they ALWAYS appear
   for everyone (like the bell). Idempotent: safe to call many times. */
(function(){
  function build(){
    try{
      // Shared speed/look panel: outside Speed & Turn and Command Center > Control.
      if(!document.getElementById('sw-sens-panel')){
        var saved=parseFloat(sampleStorage.getItem('sw_look_sens')||'0.002'); window._swLookSens=saved;
        var savedW=parseFloat(sampleStorage.getItem('sw_walk_spd')||'0'); if(savedW>0){ window._swWalkSpd=savedW; } else { savedW=0; }
        var savedT=parseFloat(sampleStorage.getItem('sw_turn_spd')||'0.006'); window._swTurnSpd=savedT;
        var savedD=parseFloat(sampleStorage.getItem('sw_drive_scale')||'1'); if(!Number.isFinite(savedD))savedD=1; savedD=Math.max(.2,Math.min(2,savedD)); window._swDriveScale=savedD;
        var panel=document.createElement('div');
        panel.id='sw-sens-panel';
        panel.style.cssText='position:fixed;top:96px;right:12px;z-index:100000;background:#ffffff;color:#1f2a33;border-radius:14px;padding:16px;width:256px;box-shadow:0 8px 30px rgba(0,0,0,.3);font:600 12px Segoe UI,Arial;display:none;';
        function _row(icon,label,id,val,min,max){return '<div class="sw-speed-row"><label for="'+id+'">'+icon+' '+label+'</label><input id="'+id+'" type="number" inputmode="numeric" min="'+min+'" max="'+max+'" value="'+val+'"></div>';}
        panel.setAttribute('role','region');panel.setAttribute('aria-label','Player Controls');
        panel.innerHTML='<div class="sw-speed-header"><span>🎮 Player Controls</span><button id="sw-sens-close" type="button" aria-label="Close speed controls">×</button></div><p class="sw-speed-help">Lower numbers slow things down. Drive Speed is a percentage: 100 keeps the normal car speed.</p>'
          +_row('🚶','Move Speed','sw-walk-in',(savedW>0?Math.round(savedW*500):100),20,800)
          +_row('🚗','Drive Speed (%)','sw-drive-in',Math.round(savedD*100),20,200)
          +_row('👁','Look Speed','sw-sens-in',Math.round(saved*10000),5,100)
          +_row('↩','Turn Speed','sw-turn-in',Math.round(savedT*1000),1,60)
          +'<button id="sw-sens-save" style="width:100%;border:none;background:#00aaff;color:#fff;font:800 15px Segoe UI;padding:12px;border-radius:10px;cursor:pointer;margin-top:4px;">Save</button>';
        document.body.appendChild(panel);
        var priorFocus;
        function _close(){panel.style.display='none';document.querySelectorAll('[aria-controls="sw-sens-panel"]').forEach(function(b){b.setAttribute('aria-expanded','false');});priorFocus?.focus?.();}
        window.__swGear=function(){
          if(panel.style.display!=='none'){_close();return;}
          priorFocus=document.activeElement;
          var a=window.__swApp;if(a){a.keys={};a._kt={};a._tk={};a._talt={};a._dragging=false;}
          panel.style.display='block';document.querySelectorAll('[aria-controls="sw-sens-panel"]').forEach(function(b){b.setAttribute('aria-expanded','true');});
          if(!window.__swDeckVisible)document.getElementById('sw-walk-in').focus({preventScroll:true});
        };
        document.getElementById('sw-sens-close').onclick=_close;
        panel.addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();_close();}});
        function _clamp(v,mn,mx){ v=parseFloat(v); if(isNaN(v)) v=mn; return Math.max(mn,Math.min(mx,v)); }
        document.getElementById('sw-sens-save').onclick=function(){
          var wv=_clamp(document.getElementById('sw-walk-in').value,20,800);
          var lv=_clamp(document.getElementById('sw-sens-in').value,5,100);
          var tv=_clamp(document.getElementById('sw-turn-in').value,1,60);
          var dv=_clamp(document.getElementById('sw-drive-in').value,20,200);
          window._swWalkSpd=wv/500; window._swLookSens=lv/10000; window._swTurnSpd=tv/1000;window._swDriveScale=dv/100;
          try{ sampleStorage.setItem('sw_walk_spd',wv/500); sampleStorage.setItem('sw_look_sens',lv/10000); sampleStorage.setItem('sw_turn_spd',tv/1000);sampleStorage.setItem('sw_drive_scale',dv/100); }catch(e){}
          document.getElementById('sw-walk-in').value=wv; document.getElementById('sw-sens-in').value=lv; document.getElementById('sw-turn-in').value=tv;document.getElementById('sw-drive-in').value=dv;
          _close();
        };
      }
      // Exit Command Center — handled by sw-exit-tab in the right-side tab strip
      // ---- Clear Route / Exit route menu (only shows while a route is drawn) ----
      if(!document.getElementById('sw-clear-route')){
        var crBtn=document.createElement('button'); crBtn.id='sw-clear-route'; crBtn.textContent='✕ Clear Route';
        crBtn.style.cssText='position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:100000;display:none;background:#c0392b;color:#fff;border:none;border-radius:22px;padding:11px 20px;font:800 14px "Segoe UI",Arial;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;';
        crBtn.onclick=function(){ try{ var a=window.__swApp; if(a._clearTour)a._clearTour(); if(a._marker)a._marker.visible=false; if(a._route)a._route.visible=false; var t2=document.getElementById('sw-route-toast'); if(t2)t2.remove(); }catch(e){} };
        document.body.appendChild(crBtn);
      }
    }catch(e){ /* keep retrying */ }
  }
  // Keep EXIT tab visible only when inside the Command Center room.
  function tick(){
    try{
      var a=window.__swApp;
      var exitTab=document.getElementById('sw-exit-tab');
      if(exitTab) exitTab.style.display=(a&&a._inCommandRoom&&!document.getElementById('sw-cmd-panel'))?'flex':'none';
      var cr=document.getElementById('sw-clear-route');
      if(cr){ var active=!!(a&&!window.__swDeckVisible&&(a._tour||(a._marker&&a._marker.visible))); cr.style.display=active?'block':'none'; }
    }catch(e){}
  }
  window._swMakeControls=build;
  // Build now (in case app already mounted), on load, and via a short retry burst — bulletproof.
  build();
  window.addEventListener('load', build);
  var tries=0; var iv=setInterval(function(){ build(); tries++; if(tries>20) clearInterval(iv); }, 500);
  setInterval(tick, 400);
})();
</script></body></html>
