name: Deploy StoreWell to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storewell-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Check and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out StoreWell
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the app and bundle staff services
        run: npm run build
      - name: Deploy existing Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: pages deploy public --project-name=storewell-3d --branch=main
